listener {
    timeout = 120  # 2 minutes
    on-timeout = brightnessctl -s set 1%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300 # 5 minutes
    on-timeout = ~/.local/bin/lock-screen.sh
}

# Turn the screen off only after the lock screen is up, so waking never flashes the unlocked session.
listener {
    timeout = 330 # 5.5 minutes
    on-timeout = pidof hyprlock > /dev/null && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900 # 15 minutes, suspends only on battery
    on-timeout = ~/.local/bin/suspend-on-battery.sh
}
